<script>window.__STATIC_DATA__={"details":{"138016940":{"id":"138016940","title":"Team Lead кросс-функциональной команды разработки","company":"КСК-Эйч Ар","url":"https://hh.ru/vacancy/138016940","region":"Москва","salary":"не указан","description":"Ведущий цифровой банк, сервисами которого ежемесячно пользуются более 12 млн жителей Узбекистана, ищет Team Lead кросс-функциональной команды разработки.\n\nСтек: Java, Go, Python, Spring Boot, Hibernate, Liquibase, PostgreSQL, Oracle, Kafka, Redis, Docker/Podman, Kubernetes, Gitlab, EFK, Grafana.\n\nЧем предстоит заниматься:\n\nУправление полным циклом разработки в кросс-функциональной команде до 10 FTE (BE, QA, SA): от бизнес-требований до продакшена и поддержки.\n\nТехническое менторство, развитие команды, 1-to-1, PDP, найм и технические интервью.\n\nАрхитектурное видение продукта: API, модели данных, границы сервисов, рефакторинг, техдолг.\n\nВзаимодействие с продуктом, проектом и стейкхолдерами: бэклог, приоритизация, прозрачность статусов.\n\nНаблюдаемость, отказоустойчивость, производительность, инциденты, дежурства, CI/CD, метрики и процессы.\n\nЧто важно:\n\nОпыт управления командой разработки от 3 лет.\n\nТехлидерство: Java/Go, 5+ лет продового Go или глубокая Java-экспертиза.\n\nКод-ревью, архитектурные решения, распределённые системы, микросервисы, идемпотентность, eventual consistency, контрактные интеграции.\n\nПродовый Kubernetes: деплойменты, canary/blue-green, autoscaling.\n\nПроцессы: Scrum/Kanban, бэклог, релизы, автотесты, инцидент-менеджмент, мониторинг, логи, алертинг.\n\nPeople management: мотивация, 1:1, выявление зон роста, PDP.\n\nФинтех: платёжные API, эквайринг, процессинг; highload и отказоустойчивость.\n\nБудет плюсом:\n\nKanban, Visa/Mastercard, внешние партнёры, PCI DSS, Kubernetes.\n\nМы предлагаем:\n\nFintech-платформу с миллионами пользователей, международную команду, удалёнку, гибкость и отсутствие бюрократии.\n\nОфициальное трудоустройство, конкурентную ЗП, обучение, ДМС и дисконт-программы.","cover_letter":"Здравствуйте!\n\nМеня заинтересовала вакансия Team Lead, так как мой опыт объединяет глубокую техническую экспертизу в Go и работу в FinTech. Более 9 лет я занимаюсь backend-разработкой, в том числе созданием внутренней инфраструктуры в «Цифра Банк», что дало мне понимание специфики банковских систем и требований к их отказоустойчивости.\n\nВ моем стеке Go занимает центральное место при разработке серверных решений и REST API. Я обладаю сильной базой в работе с SQL и NoSQL (PostgreSQL, MySQL), специализируюсь на оптимизации запросов и проектировании нестандартных архитектурных решений. Имею практический опыт работы с Docker, Nginx и CI/CD, а также стремлюсь к решению задач в области highload. Кроме того, мой опыт в блокчейн-разработке и создании смарт-контрактов позволяет мне быстро осваивать сложные распределенные системы.\n\nМеня привлекает возможность применить свои навыки в масштабном цифровом банке и развивать кросс-функциональную команду, обеспечивая высокое качество кода и производительность продукта.\n\nБуду рад обсудить мой опыт и потенциальный вклад в ваши проекты на интервью.","found_at":"2026-10-16T17:30:09+04:00","published_at":"2026-10-16T14:54:52+03:00"},"138559039":{"id":"138559039","title":"Руководитель команды разработки","company":"Защищенные Телекоммуникации","url":"https://hh.ru/vacancy/138559039","region":"Тула","salary":"не указан","description":"Требования:\n\nРелевантный опыт работы от 6-ти лет;\n\nЗнание Golang: опыт работы с конкурирующими goroutines, каналами, управлением контекстом и профилированием производительности;\n\nПонимание принципов построения микросервисной архитектуры;\n\nОпыт реализации RESTful API и GraphQL для создания гибких и эффективных интерфейсов взаимодействия;\n\nОпыт разработки с использованием PostgreSQL: создание оптимальных запросов, индексация, использование транзакций, триггеров и хранимых процедур;\n\nРабота с Kafka для организации асинхронного обмена сообщениями между сервисами;\n\nПрактический опыт мониторинга и анализа производительности систем с использованием ELK (Elasticsearch, Logstash, Kibana) для логирования, Prometheus и Grafana для метрик и визуализации, а также Jaeger и OpenTelemetry для трассировки распределенных запросов;\n\nСпособность быстро находить и устранять проблемы в сложных production-средах;\n\nОпыт управления командой продуктовой разработки от года;\n\nОпыт работы с legacy-проектами;\n\nОпыт работы с NoSQL БД (Aerospike, Couchbase, Cassandra предпочтительно, но подойдет и Redis, Mongo).\n\nДополнительные требования:\n\nОпыт разработки высоконагруженных систем;\n\nРабота с NATS/Kafka/RabbitMQ для организации асинхронного обмена сообщениями между сервисами;\n\nГлубокое понимание работы docker и docker-compose;\n\nГлубокое понимание работы k8s;\n\nУверенное использование Unix-систем;\n\nОпыт разработки на любом другом языке программирования;\n\nЗнание паттернов проектирования и построения архитектуры системы;\n\nПонимание принципов работы протоколов HTTP (v1/v2/v3);\n\nУмение использовать gRPC/Protobuf или аналоги.\n\nЗадачи:\n\nРуководить разработкой биллинговых сервисов на Go, задавать стандарты конкурентного кода;\n\nПрофилировать производительность сервисов (pprof, trace, benchmark) и устранять узкие места;\n\nПроводить код-ревью и принимать архитектурные решения по развитию сервисов;\n\nПроектировать схемы БД и писать оптимальные SQL-запросы, работать с транзакциями, триггерами и хранимыми процедурами, совместно с DBA настраивать индексацию;\n\nПрофилировать тяжёлые запросы и устранять проблемы производительности БД;\n\nОрганизовывать асинхронный обмен сообщениями между сервисами через Kafka с обеспечением идемпотентности и консистентности биллинговых операций;\n\nБыстро диагностировать и устранять инциденты в сложных production-средах;\n\nПонимать и применять Docker и docker-compose в разработке и деплое;\n\nУправлять командой разработки: планирование, распределение задач, контроль сроков, проведение 1to1, участие в найме и онбординге, формировать инженерную культуру;\n\nСинхронизировать работу команды с продуктом и смежными командами;\n\nМодернизировать legacy-код: рефакторинг, выделение сервисов, миграции;\n\nОбеспечивать обратную совместимость при изменениях;\n\nУправлять техническим долгом и приоритизировать его погашение;\n\nПроектировать решения под высокие нагрузки;\n\nОптимизировать latency и throughput критичных биллинговых операций.\n\nМы предлагаем:\n\nНадёжная основа: официальное трудоустройство (ТК РФ) в аккредитованной IT-компании;\nЗдоровье в приоритете: расширенный пакет ДМС, который включает стоматологию и поддержку психолога;\nРабота со смыслом: участие в развитии социально значимого продукта, который помогает людям оставаться на связи в сложной жизненной ситуации;\nСильная команда: мы ценим открытость, ответственность и стремление к результату, создавая среду для профессионального развития каждого;\nЗабота о тонусе: компенсируем часть стоимости вашего абонемента в спортзал;\nУдалённый формат: работа из любого города с возможностью посещать офис в Туле для рабочих сессий, корпоративных событий и неформального общения.","cover_letter":"Здравствуйте!\n\nМеня заинтересовала вакансия в «Защищенных Телекоммуникациях». Мой общий опыт в разработке составляет более 9 лет, из которых последние годы я фокусируюсь на Go, создании REST-сервисов и серверной разработке.\n\nОбладаю глубокой экспертизой в работе с SQL и NoSQL базами данных (PostgreSQL, MySQL, MariaDB), умею оптимизировать сложные запросы и проектировать структуры данных, что критично для биллинговых систем. Имею опыт работы в FinTech (Цифра Банк), где занимался развитием внутренней инфраструктуры, а также опыт разработки в сфере Blockchain и eCommerce. Свободно владею инструментами Docker, Nginx и Linux, имею практический опыт работы с CI/CD.\n\nЯ специализируюсь на проектировании нестандартных решений и стремлюсь к задачам с высокими нагрузками (highload). Мой подход сочетает в себе умение работать с legacy-ко <script>
const $ = (id) => document.getElementById(id);
let selected = null;
const STATIC = window.__STATIC_DATA__ || null;

function staticRoute(url){
  const u = new URL(url, 'http://local');
  const p = u.pathname;
  if(p === '/api/status') return STATIC.status;
  if(p === '/api/vacancies') return STATIC.vacancies.slice(0, +(u.searchParams.get('limit')||100));
  if(p === '/api/vacancy') return STATIC.details[u.searchParams.get('id')] || {};
  if(p === '/api/log') return STATIC.log || [];
  if(p === '/api/scan') return {new:0};
  return {};
}
async function j(url, opt){
  if(STATIC) return staticRoute(url);
  const r = await fetch(url, opt);
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
function relTime(iso){
  if(!iso) return "";
  const d = new Date(iso); if(isNaN(d)) return "";
  const s = Math.floor((Date.now()-d.getTime())/1000);
  if(s < 60) return s+" сек назад";
  if(s < 3600) return Math.floor(s/60)+" мин назад";
  if(s < 86400) return Math.floor(s/3600)+" ч назад";
  return Math.floor(s/86400)+" дн назад";
}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}

async function refreshStatus(){
  try{
    const st = await j('/api/status');
    $('sTotal').textContent = st.total;
    $('sLetter').textContent = st.with_letter;
    $('sNew').textContent = st.last_new;
    $('sLast').textContent = st.last_run ? relTime(st.last_run) : '—';
  }catch(e){}
}

async function refreshList(){
  let items = [];
  try{ items = await j('/api/vacancies?limit=100'); }catch(e){ return; }
  const ul = $('list');
  if(items.length === 0){
    ul.innerHTML = '<li class="empty" style="list-style:none">Пока пусто.<br>Нажми «Сканировать».</li>';
    return;
  }
  ul.innerHTML = items.map(v => `
    <li class="item ${v.id===selected?'active':''}" data-id="${v.id}">
      <div class="t">${esc(v.title)} ${v.has_letter?'<span class="badge">письмо</span>':''}</div>
      <div class="m">
        <span>${esc(v.company)}</span>
        <span>${esc(v.region)}</span>
        ${v.salary?'<span>'+esc(v.salary)+'</span>':''}
        <span>${relTime(v.found_at)}</span>
      </div>
    </li>`).join('');
  ul.querySelectorAll('.item').forEach(el => el.onclick = () => load(el.dataset.id));
}

async function load(id){
  selected = id;
  const v = await j('/api/vacancy?id='+encodeURIComponent(id));
  $('detail').innerHTML = `
    <h2>${esc(v.Title || v.title)}</h2>
    <div class="meta">
      <span>${esc(v.Company || v.company)}</span>
      <span>${esc(v.Region || v.region)}</span>
      ${(v.Salary||v.salary)?'<span>'+esc(v.Salary||v.salary)+'</span>':''}
      <span>опубликовано: ${relTime(v.PublishedAt || v.published_at)}</span>
      <a href="${esc(v.URL || v.url)}" target="_blank" rel="noopener">открыть на hh.ru →</a>
    </div>
    <div class="toolbar">
      <button id="copyBtn" class="small">Скопировать сопроводительное</button>
      <button id="openBtn" class="ghost small">Открыть вакансию</button>
    </div>
    <div class="label">Сопроводительное письмо</div>
    <textarea id="letter">${esc(v.CoverLetter ?? v.cover_letter ?? '')}</textarea>
    <div class="label">Описание вакансии</div>
    <details><summary>показать</summary><pre class="desc">${esc(v.Description ?? v.description ?? '')}</pre></details>`;
  $('copyBtn').onclick = () => copy($('letter').value);
  $('openBtn').onclick = () => window.open(v.URL || v.url, '_blank');
  refreshList();
}

function copy(text){
  navigator.clipboard.writeText(text).then(()=>{
    const t=$('toast'); t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1200);
  });
}

async function doScan(){
  $('scanBtn').disabled = true; $('scanBtn').textContent = 'Сканирую…';
  try{ await j('/api/scan', {method:'POST'}); }
  catch(e){ alert('Ошибка скана: '+e.message); }
  $('scanBtn').disabled = false; $('scanBtn').textContent = 'Сканировать';
  await refreshStatus(); await refreshList();
}

async function refreshLog(){
  if(!$('log').classList.contains('open')) return;
  try{ const lines = await j('/api/log?lines=200'); $('logBody').textContent = lines.join('\n'); }catch(e){}
}

$('scanBtn').onclick = doScan;
$('logBtn').onclick = () => {$('log').classList.add('open'); refreshLog();};
$('logClose').onclick = () => $('log').classList.remove('open');

refreshStatus(); refreshList();
setInterval(refreshStatus, 5000);
setInterval(refreshList, 5000);
setInterval(refreshLog, 3000);
</script>
